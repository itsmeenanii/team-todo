[project]
name = "team-todo"
version = "1.0.0"
description = "Collaborative Todo Application"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Django==4.2.0",
    "djangorestframework==3.14.0",
    "django-cors-headers==4.0.0",
    "djangorestframework-simplejwt==5.2.2",
    "psycopg2-binary==2.9.9",
    "dj-database-url==2.1.0",
    "whitenoise==6.5.0",
    "django-storages==1.13.2",
    "boto3==1.26.165",
    "python-dotenv==1.0.0",
    "django-filter==23.2",
    "django-phone-field==1.8.0",
    "python-decouple==3.8",
    "gunicorn==21.2.0",
    "redis==4.5.5",
    "celery==5.2.7",
    "django-celery-beat==2.5.0",
    "django-celery-results==2.5.1",
    "firebase-admin==6.2.0",
    "twilio==8.7.0",
    "djangorestframework-datatables==0.6.0",
]

[tool.vercel]
entrypoint = "team_todo.wsgi:app"

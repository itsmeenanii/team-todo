[project]
name = "team-todo"
version = "1.0.0"
description = "Collaborative Group To-Do List Application"
readme = "README.md"
requires-python = ">=3.10,<3.13"

[tool.vercel]
entrypoint = "team_todo.wsgi:app"
buildCommand = "python manage.py collectstatic --noinput"
installCommand = "pip install -r requirements.txt"
outputDirectory = "staticfiles"

[tool.vercel.dev]
buildCommand = "python manage.py collectstatic --noinput"

[tool.vercel.production]
buildCommand = "python manage.py collectstatic --noinput"
